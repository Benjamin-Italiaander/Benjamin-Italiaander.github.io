<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
  <meta name="view-transition" content="same-origin">
  <title>Quiz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f6bed'/%3E%3Ctext x='16' y='23' font-size='20' font-family='system-ui' font-weight='800' text-anchor='middle' fill='white'%3E%3F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <header class="topbar">
    <nav class="topbar-inner">
      <a href="#" class="brand"><span class="logo" aria-hidden="true">?</span> <span id="header-md"></span></a>
      <div class="tools">
        <button id="lang" class="icon-btn" type="button" popovertarget="lang-menu" data-i18n-title="language"></button>
        <div id="lang-menu" class="menu" popover role="menu"></div>
        <button id="theme" class="icon-btn" type="button" data-i18n-title="theme">
          <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21 14.5A9 9 0 0 1 9.5 3a9 9 0 1 0 11.5 11.5Z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <!-- Home: one card per Markdown file -->
    <section id="home" class="screen" hidden>
      <header id="main-md" class="hero" hidden></header>
      <div id="quizzes" class="grid" aria-live="polite"><p class="muted" data-i18n="loading">Loading quizzes…</p></div>
    </section>

    <!-- Intro for one quiz -->
    <section id="intro" class="screen panel" hidden>
      <a href="#" class="back" data-i18n="backAll">← All quizzes</a>
      <h1 id="intro-title"></h1>
      <div id="intro-desc" class="muted"></div>
      <p id="intro-meta" class="meta"></p>
      <div class="modes">
        <button id="begin-quiz" class="mode primary" type="button">
          <span class="mode-icon" aria-hidden="true">🎲</span>
          <strong data-i18n="quizOnly">Quiz only →</strong>
          <span class="small" data-i18n="quizOnlyDesc">All questions in random order</span>
        </button>
        <button id="begin-learn" class="mode secondary" type="button">
          <span class="mode-icon" aria-hidden="true">📖</span>
          <strong data-i18n="learn">Repetition mode →</strong>
          <span class="small" data-i18n="learnDesc">Background text with the question below it · from question 1 to the last, in order</span>
        </button>
      </div>
    </section>

    <!-- Question -->
    <section id="quiz" class="screen" hidden>
      <div class="quiz-head">
        <a href="#" class="back" id="quit" data-i18n="quit">✕ Quit</a>
        <span id="progress-text"></span>
        <span id="streak"></span>
      </div>
      <div class="progress"><div id="progress-bar"></div></div>
      <article id="stage" class="panel stage">
        <aside id="info" class="info" hidden></aside>
        <div class="qa">
          <p id="kind" class="muted small"></p>
          <div id="question" class="prompt"></div>
          <form id="answers" class="answers"></form>
          <div id="feedback" aria-live="polite"></div>
          <div class="actions">
            <span class="muted small keys"><span data-i18n="keys">Keys:</span> <kbd>1</kbd>–<kbd>9</kbd> <span data-i18n="keySelect">select</span> · <kbd>Enter</kbd> <span data-i18n="keyContinue">continue</span></span>
            <button id="check" class="primary" type="button" data-i18n="check">Check answer</button>
            <button id="next" class="primary" type="button" hidden>Next →</button>
          </div>
        </div>
      </article>
    </section>

    <!-- Results -->
    <section id="results" class="screen panel" hidden>
      <div class="score-wrap">
        <div id="ring" class="ring"><span id="pct"></span></div>
        <div>
          <h1 id="verdict"></h1>
          <p id="score" class="muted"></p>
        </div>
      </div>
      <div class="actions left">
        <button id="retry" class="primary" type="button" data-i18n="retry">Retry missed questions</button>
        <button id="restart" class="secondary" type="button" data-i18n="restart">Restart quiz</button>
        <a href="#" class="button secondary" data-i18n="allQuizzes">All quizzes</a>
      </div>
      <div id="review"></div>
    </section>

    <section id="error" class="screen panel" hidden>
      <h1 data-i18n="errorTitle">Something went wrong</h1>
      <pre id="error-msg"></pre>
      <a href="#" class="button secondary" data-i18n="backQuizzes">Back to quizzes</a>
    </section>
  </main>

  <dialog id="lightbox"><img alt=""></dialog>

  <dialog id="confirm-quit" class="sheet">
    <form method="dialog">
      <p data-i18n="quitConfirm">Quit this quiz? Your progress will be lost.</p>
      <div class="actions">
        <button value="stay" class="secondary" data-i18n="stay" autofocus>Keep going</button>
        <button value="quit" class="danger" data-i18n="leave">Quit</button>
      </div>
    </form>
  </dialog>

  <script src="quiz.js?v=8"></script>
</body>
</html>
