<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draaiende klok – van 12 uur naar 3 uur</title>
<style>
  :root {
    --ink: #1f2937;
    --muted: #5f6b70;
    --red: #dc2626;
    --blue: #1d4ed8;
    --page: #f4f3ef;
    --card: #ffffff;
    --border: #e5e2d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  main {
    width: 100%;
    max-width: 440px;
    text-align: center;
  }
  h1 { font-size: 1.35rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); margin: 0 0 1.2rem; font-size: 0.95rem; }
  .readout {
    background: var(--card);
    border: 1px solid var(--border);
    border-top: 3px solid var(--red);
    border-radius: 14px;
    padding: 0.9rem 1rem 1rem;
    margin-bottom: 1.1rem;
  }
  .time {
    font-size: 3rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .spoken {
    margin-top: 0.35rem;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--blue);
    min-height: 1.3em;
  }
  svg { width: 100%; height: auto; display: block; }
  .controls {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.5rem;
    margin: 1.2rem auto 0;
    max-width: 260px;
  }
  button {
    font: inherit;
    font-weight: 600;
    padding: 0.6rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: #c9c4b4; }
  button.primary { background: var(--red); border-color: var(--red); color: #fff; }
  button.primary:hover { background: #b91c1c; }
  .speeds { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.3rem; }
  .speeds .label { color: var(--muted); font-size: 0.9rem; text-align: center; }
  button.speed.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .legend { margin-top: 1rem; color: var(--muted); font-size: 0.9rem; display: flex; gap: 1.2rem; justify-content: center; }
  .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
  .swatch { width: 22px; height: 6px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<main>
  <h1>De klok draait rond</h1>
  <p class="sub">Kijk hoe de wijzers draaien. De <strong style="color:var(--red)">lange rode wijzer</strong> gaat snel rond, de <strong style="color:var(--blue)">korte blauwe wijzer</strong> gaat langzaam mee.</p>

  <div class="readout">
    <div class="time" id="time">12:00</div>
    <div class="spoken" id="spoken">twaalf uur</div>
  </div>

  <svg id="clock" viewBox="0 0 240 240" role="img" aria-label="draaiende klok">
    <circle cx="120" cy="120" r="112" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
    <g id="face"></g>
    <g id="hour"></g>
    <g id="minute"></g>
    <circle cx="120" cy="120" r="7" fill="#1f2937"/>
  </svg>

  <div class="controls">
    <button id="play" class="primary">▶ Start</button>
    <button id="reset">⟳ Opnieuw</button>
    <div class="speeds">
      <span class="label">Snelheid:</span>
      <button class="speed" data-dur="240">Heel langzaam</button>
      <button class="speed active" data-dur="144">Langzaam</button>
      <button class="speed" data-dur="72">Normaal</button>
      <button class="speed" data-dur="32">Snel</button>
    </div>
  </div>

  <div class="legend">
    <span><i class="swatch" style="background:var(--red)"></i> lange wijzer (minuten)</span>
    <span><i class="swatch" style="background:var(--blue)"></i> korte wijzer (uur)</span>
  </div>
</main>

<script>
(function () {
  var CX = 120, CY = 120;

  // --- build the clock face (ticks + numbers), hands pointing up at 12 ---
  function pt(min, r) {
    var a = min * 6 * Math.PI / 180;
    return [CX + r * Math.sin(a), CY - r * Math.cos(a)];
  }
  var face = document.getElementById('face');
  var svgNS = 'http://www.w3.org/2000/svg';
  for (var m = 0; m < 60; m++) {
    var hour = m % 5 === 0;
    var p1 = pt(m, hour ? 90 : 98), p2 = pt(m, 104);
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', p1[0].toFixed(1)); ln.setAttribute('y1', p1[1].toFixed(1));
    ln.setAttribute('x2', p2[0].toFixed(1)); ln.setAttribute('y2', p2[1].toFixed(1));
    ln.setAttribute('stroke', '#374151');
    ln.setAttribute('stroke-width', hour ? 3 : 1.4);
    face.appendChild(ln);
  }
  for (var h = 1; h <= 12; h++) {
    var pn = pt(h * 5, 74);
    var tx = document.createElementNS(svgNS, 'text');
    tx.setAttribute('x', pn[0].toFixed(1)); tx.setAttribute('y', pn[1].toFixed(1));
    tx.setAttribute('text-anchor', 'middle'); tx.setAttribute('dominant-baseline', 'central');
    tx.setAttribute('font-family', 'Arial, sans-serif'); tx.setAttribute('font-size', '20');
    tx.setAttribute('font-weight', '700'); tx.setAttribute('fill', '#1f2937');
    tx.textContent = h;
    face.appendChild(tx);
  }
  // hands as upward shapes we rotate about the centre
  function buildHand(group, len, head, half, width, color) {
    var baseY = CY - (len - head), tipY = CY - len;
    var shaft = document.createElementNS(svgNS, 'line');
    shaft.setAttribute('x1', CX); shaft.setAttribute('y1', CY);
    shaft.setAttribute('x2', CX); shaft.setAttribute('y2', baseY);
    shaft.setAttribute('stroke', color); shaft.setAttribute('stroke-width', width);
    shaft.setAttribute('stroke-linecap', 'round');
    group.appendChild(shaft);
    var tip = document.createElementNS(svgNS, 'polygon');
    tip.setAttribute('points', CX + ',' + tipY + ' ' + (CX - half) + ',' + baseY + ' ' + (CX + half) + ',' + baseY);
    tip.setAttribute('fill', color);
    group.appendChild(tip);
  }
  var minuteG = document.getElementById('minute');
  var hourG = document.getElementById('hour');
  buildHand(minuteG, 82, 22, 12, 8, '#dc2626');
  buildHand(hourG, 54, 16, 11, 10, '#1d4ed8');

  // --- Dutch spoken time for whole/5-minute marks ---
  function dutch(hh, mm) {
    var h = (hh % 12) || 12;          // 0 -> 12
    var nxt = (h % 12) + 1;
    switch (mm) {
      case 0:  return h + ' uur';
      case 5:  return '5 over ' + h;
      case 10: return '10 over ' + h;
      case 15: return 'kwart over ' + h;
      case 20: return '10 voor half ' + nxt;
      case 25: return '5 voor half ' + nxt;
      case 30: return 'half ' + nxt;
      case 35: return '5 over half ' + nxt;
      case 40: return '10 over half ' + nxt;
      case 45: return 'kwart voor ' + nxt;
      case 50: return '10 voor ' + nxt;
      case 55: return '5 voor ' + nxt;
    }
    return '';
  }

  // --- animation: simulate a full round 12:00 -> 12:00 (0..720 minutes), looping ---
  var TOTAL = 720;
  var timeEl = document.getElementById('time');
  var spokenEl = document.getElementById('spoken');
  var playBtn = document.getElementById('play');
  var resetBtn = document.getElementById('reset');

  var dur = 144;           // seconds for one full 12-hour round
  var elapsed = 0;         // seconds into the run
  var startTs = null;
  var running = false;
  var raf = null;
  var lastBucket = -1;

  function render(simMin) {
    simMin = ((simMin % TOTAL) + TOTAL) % TOTAL;   // wrap into [0, 720)
    minuteG.setAttribute('transform', 'rotate(' + (simMin % 60) * 6 + ' 120 120)');
    hourG.setAttribute('transform', 'rotate(' + (simMin / 60) * 30 + ' 120 120)');
    var hh = Math.floor(simMin / 60);
    var mm = Math.floor(simMin % 60);
    var disp = (hh % 12) || 12;
    timeEl.textContent = disp + ':' + (mm < 10 ? '0' + mm : mm);
    var bucket = Math.floor(simMin / 5);
    if (bucket !== lastBucket) {
      lastBucket = bucket;
      spokenEl.textContent = dutch(hh, (bucket % 12) * 5);
    }
  }

  function frame(ts) {
    if (startTs === null) startTs = ts - elapsed * 1000;
    elapsed = (ts - startTs) / 1000;
    render((elapsed / dur) * TOTAL);             // modulo in render() keeps it looping
    if (running) raf = requestAnimationFrame(frame);
  }

  function play() {
    running = true;
    startTs = null;
    playBtn.textContent = '⏸ Pauze';
    raf = requestAnimationFrame(frame);
  }
  function pause() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    playBtn.textContent = '▶ Verder';
  }
  function reset() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    elapsed = 0; startTs = null; lastBucket = -1;
    render(0);
    playBtn.textContent = '▶ Start';
  }

  playBtn.addEventListener('click', function () {
    if (running) pause(); else play();
  });
  resetBtn.addEventListener('click', reset);

  Array.prototype.forEach.call(document.querySelectorAll('.speed'), function (b) {
    b.addEventListener('click', function () {
      var p = elapsed / dur;                 // keep current position
      document.querySelectorAll('.speed').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      dur = parseFloat(b.getAttribute('data-dur'));
      elapsed = p * dur;
      startTs = null;                        // frame() will recompute
    });
  });

  // Optional deep-link: #min=90 shows a fixed time (12:00 = 0 ... 12:00 = 720)
  // and does not autostart, handy for demonstrating one moment.
  var fixed = (location.hash.match(/min=(\d+(?:\.\d+)?)/) || [])[1];
  if (fixed !== undefined) {
    elapsed = (parseFloat(fixed) / TOTAL) * dur;
    render(parseFloat(fixed));
    playBtn.textContent = '▶ Verder';
  } else {
    render(0);
    // gentle autostart so the motion is visible right away
    setTimeout(play, 600);
  }
})();
</script>
</body>
</html>
