<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Splitsen en optellen – werkblad</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#233044;background:#edf3f9}*{box-sizing:border-box}body{margin:0}.toolbar{max-width:850px;margin:20px auto;padding:16px 20px;background:#fff;border-radius:14px;box-shadow:0 3px 18px #20314b19;display:flex;flex-wrap:wrap;align-items:center;gap:12px}.toolbar button,.toolbar select{padding:10px 14px;border-radius:9px;border:1px solid #aabbd0;background:#fff;font-size:15px}.toolbar button{background:#2362b0;color:#fff;border:0;cursor:pointer}.toolbar button:hover{background:#154d93}.toolbar label{display:flex;align-items:center;gap:8px}.toolbar small{width:100%;color:#52677f}.page{width:210mm;min-height:297mm;background:#fff;margin:18px auto;padding:16mm 19mm 15mm;box-shadow:0 5px 22px #20314b23;break-after:page}.heading{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #d9e5f2;padding-bottom:12px;margin-bottom:18px}.heading h1{font-size:25px;margin:0;color:#174a82}.heading p{margin:7px 0 0;font-size:13px;color:#53677c}.details{font-size:13px;line-height:2.2}.problem{height:36mm;display:grid;grid-template-columns:28px 1fr;align-items:start;break-inside:avoid}.num{font-size:16px;color:#708094;padding-top:15px}.equation{display:grid;grid-template-columns:115px 32px 115px 32px 72px;align-items:start;justify-content:center;text-align:center}.operand{display:flex;align-items:center;flex-direction:column}.value,.operator{font-size:28px;font-weight:500;line-height:38px}.operator{padding-top:0}.branches{width:88px;height:25px;margin-top:1px}.branches path{stroke:#42546a;stroke-width:2.5;fill:none;stroke-linecap:round}.split-boxes{display:flex;gap:9px;margin-top:2px}.split-box{height:43px;width:43px;border:2px solid #9faebd;background:#f3f7fb;border-radius:3px}.answer{width:65px;height:58px;border:2px solid #64768a;margin:0 auto;background:#fff}.footer{margin-top:6px;font-size:12px;color:#73859a;display:flex;justify-content:space-between}@media(max-width:850px){.page{width:100%;min-height:auto;padding:20px 10px}.equation{grid-template-columns:88px 24px 88px 24px 56px}.split-box{width:35px;height:39px}.split-boxes{gap:5px}.answer{width:50px;height:52px}.value,.operator{font-size:24px}.problem{height:130px}}@page{size:A4;margin:0}@media print{body{background:white}.toolbar{display:none}.page{width:210mm;height:297mm;min-height:297mm;margin:0;padding:16mm 19mm 15mm;box-shadow:none;page-break-after:always}.page:last-child{page-break-after:auto}.problem{height:36mm}.equation{grid-template-columns:115px 32px 115px 32px 72px}.split-box{width:43px;height:43px}.split-boxes{gap:9px}.answer{width:65px;height:58px}.value,.operator{font-size:28px}}
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-top:30px}.answer-row{font-size:15px;padding:8px 0;border-bottom:1px solid #e4eaf0;white-space:nowrap}@media print{.answer-page{break-before:page}}
</style></head><body>
<div class="toolbar"><strong>🧮 Rekenwerkblad</strong><label>Soorten sommen <select id="mode"><option value="mixed">Gemengd</option><option value="carry">Met tientaloverschrijding</option><option value="nocarry">Zonder tientaloverschrijding</option></select></label><label>Aantal <select id="count"><option>10</option><option selected>20</option><option>30</option><option>40</option></select></label><label>Maximum <select id="max"><option>50</option><option selected>100</option></select></label><button id="new">Nieuwe sommen</button><button id="answers">Antwoorden tonen</button><button id="print">Afdrukken / PDF</button><small>Elk getal heeft een eigen splitsboompje met twee lege vakjes: tientallen en eenheden.</small></div>
<main id="pages"></main>
<script>
const PER_PAGE=6; let currentSums=[]; let showAnswers=false;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function makeSums(mode,total,max){
 const options=[];
 for(let a=11;a<=max-11;a++)for(let b=a;b<=max-a;b++){
  if(b<11)continue;
  const carry=(a%10+b%10)>=10;
  if(mode==='carry'&&!carry || mode==='nocarry'&&carry)continue;
  options.push([a,b]);
 }
 for(let i=options.length-1;i>0;i--){const j=rand(0,i);[options[i],options[j]]=[options[j],options[i]];}
 return options.slice(0,total).map(([a,b])=>Math.random()<0.5?[a,b]:[b,a]);
}
function operand(n){return `<div class="operand"><div class="value">${n}</div><svg class="branches" viewBox="0 0 88 25" aria-hidden="true"><path d="M44 2 L23 20 M44 2 L65 20"/></svg><div class="split-boxes"><div class="split-box" aria-label="Tientallen"></div><div class="split-box" aria-label="Eenheden"></div></div></div>`}
function draw(){
 const mode=document.getElementById('mode').value;
 const total=Number(document.getElementById('count').value);
 const max=Number(document.getElementById('max').value);
 currentSums=makeSums(mode,total,max);showAnswers=false;
 document.getElementById('answers').textContent='Antwoorden tonen';render();
}
function render(){
 const pages=[];
 for(let i=0;i<currentSums.length;i+=PER_PAGE){
  const group=currentSums.slice(i,i+PER_PAGE);
  const pageNumber=pages.length+1;
  pages.push(`<section class="page"><div class="heading"><div><h1>Splitsen en optellen</h1><p>Splits allebei de getallen in tientallen en eenheden. Reken daarna de som uit.</p></div><div class="details">Naam: __________________<br>Datum: __________________</div></div>${group.map(([a,b],j)=>`<div class="problem"><div class="num">${i+j+1}.</div><div class="equation">${operand(a)}<div class="operator">+</div>${operand(b)}<div class="operator">=</div><div class="answer" aria-label="Antwoord"></div></div></div>`).join('')}<div class="footer"><span>Veel succes! ✏️</span><span>Pagina ${pageNumber}</span></div></section>`);
 }
 if(showAnswers){
  const answers=currentSums.map(([a,b],i)=>`<div class="answer-row">${i+1}. &nbsp; ${a} + ${b} = <strong>${a+b}</strong> &nbsp; (${Math.floor(a/10)*10} + ${a%10}) + (${Math.floor(b/10)*10} + ${b%10})</div>`).join('');
  pages.push(`<section class="page answer-page"><div class="heading"><div><h1>Antwoordenblad</h1><p>Controleer de sommen en de splitsingen.</p></div></div><div class="answer-grid">${answers}</div></section>`);
 }
 document.getElementById('pages').innerHTML=pages.join('');
}
document.getElementById('new').addEventListener('click',draw);
document.getElementById('mode').addEventListener('change',draw);
document.getElementById('count').addEventListener('change',draw);
document.getElementById('max').addEventListener('change',draw);
document.getElementById('answers').addEventListener('click',()=>{showAnswers=!showAnswers;document.getElementById('answers').textContent=showAnswers?'Antwoorden verbergen':'Antwoorden tonen';render();});
document.getElementById('print').addEventListener('click',()=>window.print());draw();
</script></body></html>
